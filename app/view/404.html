/**
 * 404 页
 *
 * 这个文件名是**框架约定**：support\exception\PageNotFoundException 在渲染

 * 所以这里只做一件事：声明状态码。
 *
 * @var string $message 框架传入的原始消息（本模板刻意不使用 —— 见 _error.html 顶部说明）
 */

$code = 404;
