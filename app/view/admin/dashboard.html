/**
 * 后台仪表盘模板
 *
 * 目前只展示「运行状态 + 配置生效情况」。

 * 这样站长能一眼看出某个配置为什么改了不生效 ——
 * 是改在 .env 里但数据库里已有旧值，还是根本没配置。
 *
 * @var string $csrf
 * @var string $siteName
 * @var string $phpVersion
 * @var string $dbDriver
 * @var bool   $debugOn
 * @var string $loginAt
 * @var string $loginIp
 * @var array<int, array{key:string,value:string,source:string,editable:bool}> $configs
 */
?>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title><?= htmlspecialchars((string) $siteName, ENT_QUOTES, 'UTF-8') ?> · 管理后台</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 32px 20px;
            background: #0f1720; color: #e8eef2;
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            font-size: 14px; line-height: 1.6;
        }
        .wrap { max-width: 900px; margin: 0 auto; }
        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
        h1 { margin: 0; font-size: 19px; font-weight: 600; }
        .mode { margin-left: 10px; padding: 2px 9px; font-size: 12px; border-radius: 999px;
                background: rgba(79, 195, 247, .16); color: #4fc3f7; }
        button.logout {
            padding: 7px 14px; cursor: pointer; font-size: 13px;
            background: transparent; color: #9db4c0;
            border: 1px solid rgba(255, 255, 255, .18); border-radius: 7px;
        }
        button.logout:hover { color: #fff; border-color: rgba(255, 255, 255, .4); }

        section {
            margin-bottom: 26px; padding: 20px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .09); border-radius: 12px;
        }
        h2 { margin: 0 0 16px; font-size: 15px; font-weight: 600; color: #cfe3ec; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
        .kv .k { font-size: 12px; color: #8aa2ae; }
        .kv .v { font-size: 15px; word-break: break-all; }
        .warn { color: #ffcb6b; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 9px 8px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, .07); }
        th { font-size: 12px; font-weight: 500; color: #8aa2ae; }
        td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
        .src { font-size: 12px; color: #8aa2ae; }
        .src.database { color: #7ee2a8; }
        .src.env { color: #ffcb6b; }
        .note { margin-top: 14px; font-size: 12.5px; color: #8aa2ae; }
        .note code { color: #cfe3ec; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>
            <?= htmlspecialchars((string) $siteName, ENT_QUOTES, 'UTF-8') ?>
            <span class="mode">
                <?= htmlspecialchars((string) ($configs[1]['value'] ?? '—'), ENT_QUOTES, 'UTF-8') ?>
            </span>
        </h1>
        <form method="post" action="/admin/logout" style="margin:0">
            <input type="hidden" name="_csrf" value="<?= htmlspecialchars((string) $csrf, ENT_QUOTES, 'UTF-8') ?>">
            <button class="logout" type="submit">退出登录</button>
        </form>
    </header>

    <section>
        <h2>运行状态</h2>
        <div class="grid">
            <div class="kv"><div class="k">PHP 版本</div><div class="v"><?= htmlspecialchars((string) $phpVersion, ENT_QUOTES, 'UTF-8') ?></div></div>
            <div class="kv"><div class="k">数据库</div><div class="v"><?= htmlspecialchars((string) $dbDriver, ENT_QUOTES, 'UTF-8') ?></div></div>
            <div class="kv">
                <div class="k">调试模式</div>
                <div class="v <?= $debugOn ? 'warn' : '' ?>">
                    <?= $debugOn ? '开启（生产环境应关闭）' : '关闭' ?>
                </div>
            </div>
            <div class="kv"><div class="k">上次登录</div><div class="v"><?= htmlspecialchars((string) $loginAt, ENT_QUOTES, 'UTF-8') ?></div></div>
            <div class="kv"><div class="k">来源 IP</div><div class="v mono"><?= htmlspecialchars((string) $loginIp, ENT_QUOTES, 'UTF-8') ?></div></div>
        </div>
    </section>

    <section>
        <h2>配置生效情况</h2>
        <table>
            <thead>
            <tr>
                <th style="width:34%">配置项</th>
                <th style="width:34%">当前生效值</th>
                <th style="width:32%">来源</th>
            </tr>
            </thead>
            <tbody>
            <?php foreach ($configs as $row): ?>
                <tr>
                    <td class="mono"><?= htmlspecialchars((string) $row['key'], ENT_QUOTES, 'UTF-8') ?></td>
                    <td class="mono"><?= htmlspecialchars((string) $row['value'], ENT_QUOTES, 'UTF-8') ?></td>
                    <td class="src"><?= htmlspecialchars((string) $row['source'], ENT_QUOTES, 'UTF-8') ?></td>
                </tr>
            <?php endforeach; ?>
            </tbody>
        </table>
        <p class="note">
            取值优先级：<code>数据库</code> →
            <code>环境变量 .env</code> → <code>代码默认值</code>。
            同一个键如果数据库里已有值，改 <code>.env</code> 不会生效 ——
            需要先在后台把它恢复默认（删除该项）。
        </p>
    </section>
</div>
</body>
</html>
