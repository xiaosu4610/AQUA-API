<?php
/**
 * 后台登录页模板
 *
 * 这是原生 PHP 模板（Webman 的 Raw 渲染器），变量由控制器 extract 进来。
 * 约定：**所有输出到 HTML 的变量都必须经过 htmlspecialchars**，
 * 否则一旦将来这些值来自用户输入，就会变成 XSS 漏洞。
 *
 * @var string $csrf  CSRF 令牌
 * @var string $error 错误提示，空串表示无错误
 */
?>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 后台不需要被搜索引擎收录 -->
    <meta name="robots" content="noindex, nofollow">
    <title>管理后台 · 登录</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #0f2027, #203a43, #2c5364);
            font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #e8eef2;
        }
        .card {
            width: 100%; max-width: 360px; padding: 32px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 14px;
            backdrop-filter: blur(6px);
        }
        h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
        .hint { margin: 0 0 22px; font-size: 13px; color: #9db4c0; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #9db4c0; }
        input[type=password] {
            width: 100%; padding: 11px 13px; margin-bottom: 18px;
            background: rgba(0, 0, 0, .25); color: #fff;
            border: 1px solid rgba(255, 255, 255, .18); border-radius: 8px;
            font-size: 15px; outline: none;
        }
        input[type=password]:focus { border-color: #4fc3f7; }
        button {
            width: 100%; padding: 11px; cursor: pointer;
            background: #4fc3f7; color: #06232e;
            border: 0; border-radius: 8px;
            font-size: 15px; font-weight: 600;
        }
        button:hover { background: #7fd4fa; }
        .error {
            margin-bottom: 18px; padding: 10px 12px;
            background: rgba(244, 67, 54, .15);
            border: 1px solid rgba(244, 67, 54, .45);
            border-radius: 8px; font-size: 13px; color: #ffb4ad;
        }
    </style>
</head>
<body>
<form class="card" method="post" action="/admin/login">
    <h1>管理后台</h1>
    <p class="hint">超级管理员后台 · 仅需密码</p>

    <?php if (($error ?? '') !== ''): ?>
        <div class="error"><?= htmlspecialchars((string) $error, ENT_QUOTES, 'UTF-8') ?></div>
    <?php endif; ?>

    <input type="hidden" name="_csrf" value="<?= htmlspecialchars((string) $csrf, ENT_QUOTES, 'UTF-8') ?>">

    <label for="password">管理员密码</label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" autofocus required>

    <button type="submit">登 录</button>
</form>
</body>
</html>
