/**
 * 后台共用样式

 * 抽成单独片段的原因：后台页面会越来越多，
 * 样式散在每页里会导致「改一个颜色要改 N 个文件」，很快就会不一致。

 * 这里刻意用 <style> 内联而不是独立 .css 文件：
 * 后台是低频访问的内部页面，少一次请求、也少一处「静态资源没配好」的故障点。
 * 将来页面变多、或需要给公开门户做缓存时，再考虑抽成 public/ 下的静态文件。
 */
