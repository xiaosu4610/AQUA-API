<?php
/**
 * 后台共用样式（明亮主题）
 *
 * 设计取向：
 *   · 以白底 + 浅灰背景为主，长时间看后台不累眼；深色只用在需要强调的地方
 *   · 主色沿用项目的「水（aqua）」意象 —— 青蓝色，与项目名呼应
 *   · 状态色语义化：成功=green、失败=red、提示=amber、中性=slate
 *
 * 为什么抽成单独片段而不是每页各写一份：
 *   后台页面会越来越多，样式散在各页里必然导致「改一个颜色要改 N 个文件」，
 *   很快就会不一致。这里一次性定义好，页面只负责用语义类名。
 *
 * 模板里**不要再写硬编码颜色**（如 style="color:#7ee2a8"），
 * 一律用下面的语义类：.text-ok / .text-danger / .text-warn / .muted
 * —— 否则换主题时必然漏改。
 *
 * 本文件被各页 include 在 <head> 里，因此 favicon 的声明也放在这里一处即可。
 */
?>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
    /* ── 基础 ───────────────────────────────────────────── */
    :root {
        --bg: #f5f7fa;
        --surface: #ffffff;
        --border: #e3e8ef;
        --border-strong: #cdd5df;
        --text: #1b2733;
        --muted: #6b7d8f;
        --accent: #0d9dbf;
        --accent-dark: #0a7f9c;
        --accent-soft: #e6f6fa;
        --ok: #12a150;
        --ok-soft: #e8f7ee;
        --danger: #e5484d;
        --danger-soft: #fdecec;
        --warn: #c77405;
        --warn-soft: #fdf4e3;
        --radius: 10px;
        --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);

        /* 间距刻度：模板里只用这五档。
           各处随手写 margin/padding 的数值，是页面之间「松紧不一致」的主要来源 */
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 18px;
        --sp-5: 26px;
        --sp-6: 38px;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0; padding: 28px 20px 48px;
        background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        font-size: 14px; line-height: 1.65;
        -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 1080px; margin: 0 auto; }

    /* ── 图标与文字的基线对齐 ──────────────────────────── */
    .ico { vertical-align: -3px; flex: none; }

    /* ── 页头 ───────────────────────────────────────────── */
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 16px; }
    h1 { margin: 0; font-size: 19px; font-weight: 650; display: flex; align-items: center; gap: 9px; letter-spacing: .2px; }
    /* 品牌图标：站长的 ICO 同时用作 favicon 与 logo（浏览器会自动挑最合适的那一档尺寸） */
    .brand-logo {
        display: block; border-radius: 6px; flex: none;
        width: 26px; height: 26px;
    }
    .mode {
        padding: 2px 10px; font-size: 12px; font-weight: 500; border-radius: 999px;
        background: var(--accent-soft); color: var(--accent-dark);
        border: 1px solid #cceaf2;
    }

    /* ── 导航 ───────────────────────────────────────────── */
    nav.tabs {
        display: flex; flex-wrap: wrap; gap: 4px;
        margin-bottom: 22px; padding: 4px;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 12px; box-shadow: var(--shadow);
    }
    nav.tabs a.tab {
        display: flex; align-items: center; gap: 7px;
        padding: 8px 14px; font-size: 13.5px; text-decoration: none;
        color: var(--muted); border-radius: 8px;
    }
    nav.tabs a.tab:hover { color: var(--text); background: #f2f6f9; }
    nav.tabs a.tab.on { color: var(--accent-dark); background: var(--accent-soft); font-weight: 600; }

    /* ── 卡片区块 ───────────────────────────────────────── */
    section {
        margin-bottom: 20px; padding: 22px;
        background: var(--surface);
        border: 1px solid var(--border); border-radius: 14px;
        box-shadow: var(--shadow);
    }
    h2 {
        margin: 0 0 16px; font-size: 15px; font-weight: 650;
        display: flex; align-items: center; gap: 8px;
    }
    h2 .ico { color: var(--muted); }

    /* ── 统计卡片 ───────────────────────────────────────── */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
    .stat {
        padding: 14px 16px; border-radius: var(--radius);
        background: #fafcfe; border: 1px solid var(--border);
    }
    .stat .n { font-size: 23px; font-weight: 680; line-height: 1.25; letter-spacing: -.5px; }
    .stat .l { font-size: 12px; color: var(--muted); }
    .stat.accent { background: var(--accent-soft); border-color: #cceaf2; }
    .stat.accent .n { color: var(--accent-dark); }
    .stat.ok .n { color: var(--ok); }
    .stat.danger .n { color: var(--danger); }

    /* 兼容旧的 .grid/.kv 写法 */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
    .kv .k { font-size: 12px; color: var(--muted); }
    .kv .v { font-size: 15px; word-break: break-all; }

    /* ── 表格 ───────────────────────────────────────────── */
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th {
        font-size: 12px; font-weight: 600; color: var(--muted);
        background: #fafcfe; white-space: nowrap;
    }
    th:first-child { border-top-left-radius: 8px; }
    th:last-child { border-top-right-radius: 8px; }
    tbody tr:hover { background: #fbfdff; }
    tbody tr:last-child td { border-bottom: 0; }
    .compact th, .compact td { padding: 7px 9px; font-size: 12.5px; }

    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; }
    .src { font-size: 12px; color: var(--muted); }

    /* ── 语义文字色（模板里只用这些，不要写死颜色）───────── */
    .text-ok { color: var(--ok); }
    .text-danger { color: var(--danger); }
    .text-warn { color: var(--warn); }
    .text-accent { color: var(--accent-dark); }
    .muted { color: var(--muted); }

    /* ── 徽标 ───────────────────────────────────────────── */
    .pill {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 1px 9px; font-size: 12px; border-radius: 999px;
        background: #f1f5f9; color: var(--muted); border: 1px solid var(--border);
    }
    .pill.ok { background: var(--ok-soft); color: #0b7c3e; border-color: #c8ecd6; }
    .pill.danger { background: var(--danger-soft); color: #c0353a; border-color: #f7cfd0; }
    .pill.warn { background: var(--warn-soft); color: #a05f04; border-color: #f0dcb4; }
    .pill.accent { background: var(--accent-soft); color: var(--accent-dark); border-color: #cceaf2; }

    /* ── 表单控件 ───────────────────────────────────────── */
    .field { margin-bottom: 18px; }
    /* display:block 是必须的：标签现在写成 <label>（为了读屏与点击聚焦），
       而 label 默认是行内元素，不加这条会与输入框挤在同一行 */
    .lbl { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    .tip { font-size: 12px; color: var(--muted); margin-top: 5px; }

    /* 所有「填字」类输入框统一成同一副样子。
       原来只列了 text / password / number，于是 type=email 的输入框
       （登录、注册页的邮箱）退回浏览器默认宽度，看起来像被截断了一截 ——
       同类问题还会出现在 tel / url / date 上，所以这里按「凡是能打字的」来列。
       input:not([type]) 也要写上：不写 type 属性的 <input> 默认就是文本框，
       但它不匹配 input[type=text]，容易被漏掉。 */
    input:not([type]), input[type=text], input[type=password], input[type=number],
    input[type=email], input[type=tel], input[type=url], input[type=search],
    input[type=date], input[type=datetime-local], input[type=time],
    select, textarea {
        width: 100%; padding: 9px 12px;
        background: #fff; color: var(--text);
        border: 1px solid var(--border-strong); border-radius: 8px;
        font-size: 14px; font-family: inherit; outline: none;
        transition: border-color .12s, box-shadow .12s;
    }
    input:not([type]):focus, input[type=text]:focus, input[type=password]:focus,
    input[type=number]:focus, input[type=email]:focus, input[type=tel]:focus,
    input[type=url]:focus, input[type=search]:focus, input[type=date]:focus,
    input[type=datetime-local]:focus, input[type=time]:focus,
    select:focus, textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(13, 157, 191, .13);
    }
    input:disabled, select:disabled, textarea:disabled { background: #f6f8fa; color: var(--muted); }
    textarea {
        min-height: 110px; resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px;
    }
    label.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
    label.check input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
    .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }

    /* ── 按钮 ───────────────────────────────────────────── */
    button { font-family: inherit; }
    button.primary, a.primary {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 9px 20px; cursor: pointer; font-size: 14px; font-weight: 600;
        background: var(--accent); color: #fff; border: 1px solid var(--accent);
        border-radius: 8px; text-decoration: none;
    }
    button.primary:hover, a.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

    button.ghost, a.ghost {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 12px; cursor: pointer; font-size: 12.5px;
        background: #fff; color: var(--muted);
        border: 1px solid var(--border-strong); border-radius: 7px; text-decoration: none;
    }
    button.ghost:hover, a.ghost:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
    button.ghost.danger, a.ghost.danger { color: var(--danger); border-color: #f2c9ca; }
    button.ghost.danger:hover { background: var(--danger-soft); border-color: var(--danger); }

    button.logout {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 7px 14px; cursor: pointer; font-size: 13px;
        background: #fff; color: var(--muted);
        border: 1px solid var(--border-strong); border-radius: 8px;
    }
    button.logout:hover { color: var(--danger); border-color: #f2c9ca; background: var(--danger-soft); }

    .row-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .actions-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 22px; }

    /* ── 提示条 ─────────────────────────────────────────── */
    .alert {
        display: flex; gap: 10px; align-items: flex-start;
        margin-bottom: 18px; padding: 12px 15px; border-radius: var(--radius);
        font-size: 13.5px; border: 1px solid;
    }
    .alert .ico { margin-top: 2px; }
    .alert.ok { background: var(--ok-soft); border-color: #c8ecd6; color: #0b6b37; }
    .alert.err { background: var(--danger-soft); border-color: #f7cfd0; color: #a82f34; }
    .alert.info { background: var(--accent-soft); border-color: #cceaf2; color: #0a6c84; }

    /* ── 空状态 ─────────────────────────────────────────── */
    .empty {
        padding: 30px 20px; text-align: center;
        color: var(--muted); font-size: 13.5px;
        background: #fafcfe; border: 1px dashed var(--border-strong); border-radius: var(--radius);
    }
    .empty .ico { color: #b6c3d0; margin-bottom: 8px; }

    /* ── 说明文字与代码 ─────────────────────────────────── */
    .note { margin-top: 14px; font-size: 12.5px; color: var(--muted); line-height: 1.8; }
    .note b { color: var(--text); }
    code {
        padding: 1px 6px; border-radius: 5px;
        background: #eef2f6; color: #33475b;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px;
    }

    /* ── 带分隔线的条目列表（检测结果、失败原因、注销后果清单都用它）
       放在共用样式里而不是某一页内联：同一个观感在三处出现，
       各写一份迟早会变成「这一页行距 8px、那一页 12px」 */
    .probe-list { margin: 0; padding: 0; list-style: none; }
    .probe-list li { padding: 8px 0; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
    .probe-list li:last-child { border-bottom: 0; }

    /* ── 折叠区（用于「高级配置」这类不必每次看的字段）────── */
    /* 折叠而不隐藏：默认收起能保持主表单清爽，但高级功能仍然可发现，
       不用去翻文档才知道有这些选项 */
    details.adv {
        margin: 0 0 20px; border: 1px solid var(--border);
        border-radius: var(--radius); background: #fafcfe;
    }
    details.adv > summary {
        display: flex; align-items: center; gap: 8px;
        padding: 13px 16px; cursor: pointer;
        font-size: 13.5px; font-weight: 600; list-style: none;
    }
    details.adv > summary::-webkit-details-marker { display: none; }
    details.adv > summary .ico { color: var(--muted); }
    details.adv > summary::after {
        content: '展开'; margin-left: auto;
        font-size: 12px; font-weight: 400; color: var(--accent-dark);
    }
    details.adv[open] > summary { border-bottom: 1px solid var(--border); }
    details.adv[open] > summary::after { content: '收起'; }
    details.adv .adv-body { padding: 18px 16px 2px; }
    details.adv .field { margin-bottom: 16px; }
    details.adv textarea { min-height: 84px; }
    .adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0 16px; }

    /* ── 小工具 ─────────────────────────────────────────── */
    .between { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .mt-0 { margin-top: 0; }
    .mb-0 { margin-bottom: 0; }
    hr.sep { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }

    /* ══════════════════════════════════════════════════════
       页面骨架：数据页固定四段式
         页头 → 筛选栏 → 汇总卡 → 表格
       所有列表页都长这样。**一致本身就是「好看」的主要来源** ——
       用户学会一个页面就学会了全部，也就不用每个页面重新找东西。
       ══════════════════════════════════════════════════════ */

    /* ── 第一段：页头 ───────────────────────────────────── */
    .page-head {
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4);
    }
    .page-head .ph-main { min-width: 0; }
    .page-head h1 { font-size: 20px; }
    .page-head .ph-desc { margin: var(--sp-1) 0 0; font-size: 13px; color: var(--muted); }
    .page-head .ph-actions { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }

    .crumb { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
    .crumb a { color: var(--muted); text-decoration: none; }
    .crumb a:hover { color: var(--accent-dark); }
    .crumb .sep { margin: 0 6px; color: var(--border-strong); }

    /* ── 第二段：筛选栏 ─────────────────────────────────── */
    .filter-bar {
        display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap;
        padding: var(--sp-3); margin-bottom: var(--sp-3);
        background: #fafcfe; border: 1px solid var(--border); border-radius: var(--radius);
    }
    /* 用 display:contents 让 <form> 不产生额外盒子，
       这样筛选控件仍与栏内其它元素在同一行 */
    .filter-bar form { display: contents; }
    .filter-bar input[type=text], .filter-bar input[type=search], .filter-bar select {
        width: auto; min-width: 130px; padding: 6px 10px; font-size: 13px;
    }
    .filter-bar .spacer { margin-left: auto; }

    /* 已生效的筛选条件显示成可移除的标签：
       让人随时看得出「现在筛的是什么」，并且能单独去掉一个 ——
       比让人回头去猜下拉框里的值要可靠 */
    .tag {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 2px 4px 2px 10px; font-size: 12px; border-radius: 999px;
        background: var(--accent-soft); color: var(--accent-dark); border: 1px solid #cceaf2;
    }
    .tag a { color: inherit; text-decoration: none; opacity: .6; padding: 0 3px; font-size: 15px; line-height: 1; }
    .tag a:hover { opacity: 1; }

    /* ── 第三段：汇总卡（用已有的 .stats / .stat）────────── */

    /* ── 卡片：section 的另一种写法（语义等价，表格页更顺手）── */
    .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 14px; box-shadow: var(--shadow);
        padding: 22px; margin-bottom: 20px;
    }
    /* flush：表格卡片不要内边距，让表头贴边，横向滚动条也就不会内缩 */
    .card.flush { padding: 0; overflow: hidden; }
    .card.flush .card-head { padding: 18px 22px 14px; margin-bottom: 0; }
    .card.flush .table-scroll { border-top: 1px solid var(--border); }
    .card.flush .pager { padding: 0 22px 18px; }
    .card-head {
        display: flex; align-items: center; justify-content: space-between;
        gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-3);
    }
    .card-head h2 { margin: 0; }

    /* ══════════════════════════════════════════════════════
       三态：加载 / 空 / 错误
       三种都必须齐备 —— 「丑」的主要来源就是缺这几个状态，
       于是用户看到的是白屏、空白表格或者一个转圈的圈。
       ══════════════════════════════════════════════════════ */

    /* 加载态用**骨架屏**而不是转圈：
       转圈只说明「在忙」，骨架屏还说明了「将会出现什么、出现在哪里」，
       这是感知速度差异最大的一个细节 */
    .skeleton {
        border-radius: 6px;
        background: linear-gradient(90deg, #eef2f6 25%, #e3e9f0 37%, #eef2f6 63%);
        background-size: 400% 100%;
        animation: sk 1.4s ease-in-out infinite;
    }
    .skeleton.line { height: 12px; margin: var(--sp-2) 0; }
    .skeleton.cell { height: 12px; }
    @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    /* 尊重系统的「减少动态效果」设置。
       除了骨架屏，入场/悬停这类动效也一并关掉：这个偏好是给人用的，
       多半意味着「动起来会让我不舒服」，不该只关一半 */
    @media (prefers-reduced-motion: reduce) {
        .skeleton { animation: none; }
        *, *::before, *::after {
            animation-duration: .01ms !important;
            animation-delay: 0ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: .01ms !important;
        }
    }

    /* 空态必须给**下一步动作** —— 只写「暂无数据」等于把用户丢在原地 */
    .empty .empty-ico { color: #b6c3d0; }
    .empty .empty-title { margin: 6px 0 4px; font-size: 14px; font-weight: 600; color: var(--text); }
    .empty .empty-text { margin: 0 auto; max-width: 460px; line-height: 1.75; }
    .empty .empty-actions { margin-top: var(--sp-3); display: flex; gap: var(--sp-2); justify-content: center; flex-wrap: wrap; }

    /* 错误态必须给**重试** —— 用户唯一能做的就是再试一次，那就把按钮给他 */
    .error-state {
        padding: var(--sp-5) var(--sp-4); text-align: center;
        border: 1px solid #f7cfd0; background: var(--danger-soft);
        border-radius: var(--radius); color: #a82f34; font-size: 13.5px;
    }
    .error-state .es-title { font-weight: 600; margin-bottom: 4px; }
    .error-state .es-text { color: #b45156; }
    .error-state .es-actions { margin-top: var(--sp-3); }

    /* ── 分页 ───────────────────────────────────────────── */
    .pager { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: var(--sp-4); font-size: 13px; }
    .pager .pg-info { color: var(--muted); margin-right: auto; }
    .pager a, .pager .pg-cur, .pager .pg-off {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 32px; height: 32px; padding: 0 9px;
        border: 1px solid var(--border-strong); border-radius: 7px;
        background: #fff; color: var(--text); text-decoration: none;
    }
    .pager a:hover { border-color: var(--accent); background: var(--accent-soft); }
