<?php
/**
 * 后台 · 修改密码页
 *
 * 为什么必须有这一页：
 *   后台是「超级管理员后台」，登录只凭密码，没有用户名，也没有找回密码的邮件流程。
 *   如果只能靠改 .env 或直接改数据库来换密码，站长每次换密码都得登服务器 ——
 *   这在实际使用中是不可接受的。
 *
 * 安全要求（都体现在实现里）：
 *   · 必须先验证**当前密码**，避免会话被劫持后攻击者直接改密码锁死管理员；
 *   · 新密码要求最短长度，并要求两次输入一致；
 *   · 提交走 POST + CSRF 令牌；
 *   · 密码在数据库里只存哈希（bcrypt，由 password_hash 生成），任何时候不存明文。
 *
 * @var string $csrf
 * @var string $siteName
 * @var string $siteMode
 * @var string $notice
 * @var string $noticeType ok | err
 */
$noticeType = $noticeType ?? 'info';
?>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title><?= htmlspecialchars((string) $siteName, ENT_QUOTES, 'UTF-8') ?> · 修改密码</title>
    <?php include __DIR__ . '/_style.html'; ?>
</head>
<body>
<div class="wrap">
    <?php $active = 'password'; include __DIR__ . '/_header.html'; ?>

    <?php if (($notice ?? '') !== ''): ?>
        <div class="alert <?= htmlspecialchars((string) $noticeType, ENT_QUOTES, 'UTF-8') ?>">
            <?= icon($noticeType === 'err' ? 'alert' : 'check', 17) ?>
            <span><?= htmlspecialchars((string) $notice, ENT_QUOTES, 'UTF-8') ?></span>
        </div>
    <?php endif; ?>

    <section style="max-width:520px">
        <h2><?= icon('lock', 18) ?>修改管理员密码</h2>

        <form method="post" action="/admin/password">
            <input type="hidden" name="_csrf" value="<?= htmlspecialchars((string) $csrf, ENT_QUOTES, 'UTF-8') ?>">

            <div class="field">
                <div class="lbl">当前密码</div>
                <input type="password" name="current_password" autocomplete="current-password" required>
            </div>

            <div class="field">
                <div class="lbl">新密码（至少 8 位）</div>
                <input type="password" name="new_password" autocomplete="new-password" required>
            </div>

            <div class="field">
                <div class="lbl">再次输入新密码</div>
                <input type="password" name="confirm_password" autocomplete="new-password" required>
            </div>

            <div class="actions-bar">
                <button class="primary" type="submit"><?= icon('check', 16) ?>确认修改</button>
            </div>
        </form>

        <p class="note">
            密码在数据库中<b>只保存哈希</b>（bcrypt），不保存明文，也无法被还原。<br>
            如果忘记当前密码，可在服务器上执行
            <code>sudo -u www-data php scripts/reset-admin-password.php</code> 重置。
        </p>
    </section>
</div>
</body>
</html>
