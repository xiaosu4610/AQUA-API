<?php
/**
 * 公开页页脚
 *
 * 自己从配置里读站点信息，而不是要求每个页面各传一次 ——
 * 页脚属于页面框架的一部分，与具体页面无关。这样新增公开页时
 * 只要 include 一行，备案号与自定义页脚就不会漏。
 *
 * @var bool|null $rechargeEnabled 是否已开通在线充值；不传则自行判断
 */

use app\common\Settings;

$rechargeEnabled = $rechargeEnabled ?? null;

$icp = trim((string) Settings::get('site.icp', ''));
$footerText = trim((string) Settings::get('site.footer', ''));

// 页脚要显示「是否支持充值」，但只有真正需要时才算一次
if ($rechargeEnabled === null) {
    try {
        $rechargeEnabled = \app\common\Epay::enabled();
    } catch (\Throwable $e) {
        $rechargeEnabled = false;
    }
}
?>
<footer class="site shell">
    <span><span class="dot"></span>服务运行中</span>
    <?php if (!empty($rechargeEnabled)): ?>
        <span>支持在线充值</span>
    <?php endif; ?>
    <span>
        <?php if ($footerText !== ''): ?>
            <?= htmlspecialchars($footerText, ENT_QUOTES, 'UTF-8') ?>
        <?php else: ?>
            由开源项目
            <a href="https://gitee.com/xiaosu4610/aqua-api-php" target="_blank" rel="noopener">aqua-api-php</a>
            驱动 · MIT 许可
        <?php endif; ?>
    </span>
    <?php if ($icp !== ''): ?>
        <span><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener"><?= htmlspecialchars($icp, ENT_QUOTES, 'UTF-8') ?></a></span>
    <?php endif; ?>
    <span style="margin-left:auto"><a href="/healthz">状态</a></span>
</footer>
