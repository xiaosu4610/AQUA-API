<form class="auth-card" method="post" action="/register">
    <?php include __DIR__ . '/_auth_head.html'; ?>

    <h1>注册</h1>
    <p class="lead">
        <?php if (!empty($needVerify) && !empty($mailReady)): ?>
            填写邮箱后点「获取验证码」，把邮件里的 6 位数字填进来即可完成注册
        <?php elseif (!empty($needVerify) && empty($mailReady)): ?>
            注册后即可直接使用（本站的邮件服务尚未配置，暂不强制邮箱验证）
        <?php else: ?>
            注册后即可直接使用
        <?php endif; ?>
    </p>

    <?php if (($error ?? '') !== ''): ?>
        <div class="alert err">

    <div class="field">
        <div class="lbl">邮箱</div>
        <input type="email" name="email" id="email-input" required autocomplete="username"
               value="<?= htmlspecialchars((string) ($email ?? ''), ENT_QUOTES, 'UTF-8') ?>">

        <div class="field">

                <input type="text" name="email_code" inputmode="numeric" autocomplete="one-time-code"

        &nbsp;·&nbsp;<a href="/">返回首页</a>
    </div>
</form>

<?php if (!empty($needVerify) && !empty($mailReady)): ?>
<script>
    // 「获取验证码」：异步请求，不刷新页面 —— 刷新会把用户填好的密码与邀请码清空，
    // 那是很典型的「越用越气」的细节。成功后按钮进入 60 秒倒计时（后端也有同样的限流）。
    (function () {
        var btn = document.getElementById('code-btn');
        var tip = document.getElementById('code-tip');
        var email = document.getElementById('email-input');
        var csrf = document.querySelector('input[name="_csrf"]').value;
        if (!btn || !tip || !email) { return; }

        var timer = null;
        var countdown = function (seconds) {
            var left = seconds;
            btn.disabled = true;
            btn.textContent = left + ' 秒后可重发';
            timer = setInterval(function () {
                left--;
                if (left <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = '重新获取';
                    return;
                }
                btn.textContent = left + ' 秒后可重发';
            }, 1000);
        };

        btn.addEventListener('click', function () {
            if (email.value.trim() === '') {
                tip.textContent = '请先填写邮箱地址';
                email.focus();
                return;
            }

            btn.disabled = true;
            btn.textContent = '发送中…';
            tip.textContent = '正在发送…';

            var body = new URLSearchParams();
            body.append('_csrf', csrf);
            body.append('email', email.value.trim());

            fetch('/register/code', {method: 'POST', body: body, headers: {'X-Requested-With': 'fetch'}})
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    tip.textContent = data.message || '';
                    if (data.ok) {
                        countdown(Math.max(30, data.retryAfter || 60));
                        return;
                    }
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                })
                .catch(function () {
                    tip.textContent = '网络异常，请稍后重试';
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                });
        });
    })();
</script>
<?php endif; ?>

</body>
</html>
