<?php
/**
 * 用户侧 · 令牌创建成功
 *
 * 这一页在创建那一刻把明文令牌交给用户 —— 无论站长是否开着「随时复制」，
 * 这一刻都必须给，因为用户接下来马上要用它。
 *
 * 但**之后还能不能再看到**是两回事，页面必须说清当前是哪种：
 *   · 开着「随时复制」→ 告诉他「以后回控制台也能复制」，别让他惊慌地以为错过了；
 *   · 关着          → 库里只有 SHA-256 哈希，之后谁也还原不出来，必须当场存好。
 * 说反了会直接造成损失（关了却让人以为还能再拿，用户真的会丢令牌）。
 *
 * @var string $csrf
 * @var string $siteName
 * @var string $siteMode
 * @var string $plain 令牌明文
 * @var string $name  令牌名称
 * @var bool   $revealEnabled 站长是否开启了「随时复制」
 * @var string $apiBaseUrl 本站接入地址（已带 /v1）
 */
?>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>令牌已创建 · <?= htmlspecialchars((string) $siteName, ENT_QUOTES, 'UTF-8') ?></title>
    <?php include __DIR__ . '/../admin/_style.html'; ?>
</head>
<body>
<div class="wrap">
    <?php $active = 'console'; include __DIR__ . '/_header.html'; ?>

    <section style="max-width:760px">
        <h2><?= icon('key', 18) ?>令牌已创建：「<?= htmlspecialchars((string) $name, ENT_QUOTES, 'UTF-8') ?>」</h2>

        <?php if (!empty($revealEnabled)): ?>
            <div class="alert ok">
                <?= icon('check', 17) ?>
                <span>
                    <b>本站开启了「随时复制」。</b>
                    这串令牌以后可以在<b>控制台</b>里再次复制，忘了也不用重建。
                    不过既然已经在这里了，建议现在就存进你要用的客户端 ——
                    少跑一趟，也免得中间被人看到。
                </span>
            </div>
        <?php else: ?>
            <div class="alert err">
                <?= icon('alert', 17) ?>
                <span>
                    <b>这串令牌只会显示这一次。</b>
                    库里保存的是它的哈希值，连我们、以及任何数据库管理员都无法还原 ——
                    请现在就复制保存到安全的地方。丢失后只能删掉重建。
                </span>
            </div>
        <?php endif; ?>

        <div class="field">
            <div class="lbl">你的令牌</div>
            <input type="text" id="token" value="<?= htmlspecialchars((string) $plain, ENT_QUOTES, 'UTF-8') ?>" readonly
                   style="font-family:ui-monospace,Consolas,monospace;font-size:13px">
            <div class="actions-bar" style="margin-top:10px">
                <button class="primary" type="button" id="copy-btn"><?= icon('check', 16) ?>复制令牌</button>
                <a class="ghost" href="/console"><?= icon('dashboard', 15) ?>返回控制台</a>
            </div>
        </div>

        <hr class="sep">

        <h2><?= icon('info', 17) ?>怎么用</h2>
        <p class="note" style="margin-top:0">
            请求时把它放进 <code>Authorization</code> 头，与 OpenAI 完全一致：
        </p>
        <textarea readonly rows="6" style="min-height:auto">curl <?= htmlspecialchars((string) $apiBaseUrl, ENT_QUOTES, 'UTF-8') ?>/chat/completions \
  -H "Authorization: Bearer <?= htmlspecialchars((string) $plain, ENT_QUOTES, 'UTF-8') ?>" \
  -H "Content-Type: application/json" \
  -d '{"model":"你的模型名","messages":[{"role":"user","content":"你好"}]}'</textarea>

        <p class="note">
            把上面这段里的「你的模型名」换成<b>模型广场里列出的名字</b>就能跑。
            各客户端的接口地址填 <code><?= htmlspecialchars((string) $apiBaseUrl, ENT_QUOTES, 'UTF-8') ?></code>，
            密钥填这串令牌 —— 更详细的说明见<a href="/docs" target="_blank" rel="noopener">接口文档</a>。
        </p>
    </section>
</div>
<script>
    document.getElementById('copy-btn').addEventListener('click', function () {
        var input = document.getElementById('token');
        input.select();
        input.setSelectionRange(0, 999);

        var done = function () {
            var btn = document.getElementById('copy-btn');
            var original = btn.textContent;
            btn.textContent = '已复制';
            setTimeout(function () { btn.textContent = original; }, 1800);
        };

        // navigator.clipboard 在 http（非安全上下文）下不可用，
        // 因此保留 execCommand 兜底 —— 本地用 http://127.0.0.1 调试时会走到这里
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(input.value).then(done, done);
        } else {
            try { document.execCommand('copy'); } catch (e) { /* 用户可手工复制 */ }
            done();
        }
    });
</script>
</body>
</html>
