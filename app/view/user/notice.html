<?php
/**
 * 用户侧 · 通用提示页
 *
 * 注册成功、邮箱验证结果、密码重置完成、链接失效……都走这一页，
 * 因为它们的结构完全一样：一个状态图标 + 一段说明 + 出口链接。
 *
 * @var string $siteName
 * @var string $siteMode
 * @var string $title
 * @var string $message 多行文本（用 \n 分行，会按原样换行显示）
 * @var bool   $ok      成功还是失败（决定图标与颜色）
 * @var string $extra   补充说明（可选）
 * @var string $tokenPlain 新令牌明文（仅在注册后直接可用时出现，只显示这一次）
 */
$ok = $ok ?? false;
?>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title><?= htmlspecialchars((string) $title, ENT_QUOTES, 'UTF-8') ?> · <?= htmlspecialchars((string) $siteName, ENT_QUOTES, 'UTF-8') ?></title>
    <?php include __DIR__ . '/_auth_style.html'; ?>
</head>
<body>
<div class="auth-card">
    <?php include __DIR__ . '/_auth_head.html'; ?>

    <div class="big-mark <?= $ok ? 'text-ok' : 'text-danger' ?>" style="font-size:34px;line-height:1">
        <?= $ok ? icon('check', 40) : icon('alert', 40) ?>
    </div>

    <h1 style="text-align:center"><?= htmlspecialchars((string) $title, ENT_QUOTES, 'UTF-8') ?></h1>
    <p class="lead" style="text-align:center;white-space:pre-line"><?= htmlspecialchars((string) $message, ENT_QUOTES, 'UTF-8') ?></p>

    <?php if (!empty($tokenPlain)): ?>
        <?php /* 明文令牌只在这里出现一次。之后列表里只有掩码 —— 请立刻保存 */ ?>
        <code class="token-box"><?= htmlspecialchars((string) $tokenPlain, ENT_QUOTES, 'UTF-8') ?></code>
        <div class="tip">这串令牌只会显示这一次，请立即复制保存。</div>
    <?php endif; ?>

    <?php if (!empty($extra)): ?>
        <p class="note" style="text-align:center"><?= htmlspecialchars((string) $extra, ENT_QUOTES, 'UTF-8') ?></p>
    <?php endif; ?>

    <div class="actions-bar" style="justify-content:center">
        <a class="primary" href="<?= $ok ? '/login' : '/' ?>">
            <?= icon($ok ? 'lock' : 'home', 16) ?><?= $ok ? '去登录' : '返回首页' ?>
        </a>
        <?php /* 失败态主按钮已经指向首页，再放一个「首页」等于两个按钮去同一个地方 */ ?>
        <?php if ($ok): ?>
            <a class="ghost" href="/"><?= icon('home', 15) ?>返回首页</a>
        <?php endif; ?>
    </div>
</div>
</body>
</html>
